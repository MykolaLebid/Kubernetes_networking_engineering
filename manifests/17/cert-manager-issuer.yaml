# cert-manager-issuer.yaml
# ClusterIssuer for Let's Encrypt using HTTP-01 challenge via nginx Ingress.
# Includes both staging (for testing) and production issuers.
# Prerequisites: cert-manager must be installed (kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml)
# Apply with: kubectl apply -f cert-manager-issuer.yaml
# Then reference the issuer in Ingress annotations or Certificate objects.
---
# Staging issuer — use this for testing to avoid Let's Encrypt rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com   # Replace with your email for expiry notifications
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Production issuer — use this once staging works correctly
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com   # Replace with your email for expiry notifications
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Example Certificate object requesting a TLS cert from the production issuer.
# cert-manager will create the Secret 'tls-secret' automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-app-tls
  namespace: default
spec:
  secretName: tls-secret      # Referenced in Ingress spec.tls[].secretName
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: app.example.com
  dnsNames:
    - app.example.com
    - www.app.example.com
