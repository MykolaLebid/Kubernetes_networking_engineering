# Tetragon TracingPolicy — block shell execution in production namespace
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: no-shell-exec
spec:
  kprobes:
  - call: "security_bprm_check"
    syscall: false
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/bin/sh"
        - "/bin/bash"
        - "/usr/bin/sh"
        - "/usr/bin/bash"
        - "/bin/dash"
      matchNamespaces:
      - operator: In
        values:
        - "production"
      matchCapabilities:
      - type: Effective
        operator: NotIn
        values:
        - "CAP_SYS_ADMIN"
      matchActions:
      - action: Sigkill
