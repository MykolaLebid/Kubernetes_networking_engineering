# HIPAA default-deny NetworkPolicy for ePHI namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hipaa-default-deny
  namespace: phi-workloads
  annotations:
    compliance.hipaa/control: "164.312(a)(1)"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow EHR app to reach ePHI database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hipaa-allow-ehr-to-db
  namespace: phi-workloads
  annotations:
    compliance.hipaa/control: "164.312(a)(1)"
spec:
  podSelector:
    matchLabels:
      app: phi-database
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ehr-application
          compliance/phi-access: "approved"
    ports:
    - port: 5432
      protocol: TCP
---
# Allow DNS only for ePHI pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hipaa-allow-dns
  namespace: phi-workloads
  annotations:
    compliance.hipaa/control: "164.312(a)(1)"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
