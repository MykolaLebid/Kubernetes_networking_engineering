# headless-service.yaml
# A headless Service (clusterIP: None) does not get a virtual IP. Instead, DNS
# returns individual pod IPs directly. Required for StatefulSets to give each
# pod a stable DNS name: <pod-name>.<service-name>.<namespace>.svc.cluster.local
# Also used when clients need direct pod addressing (e.g., Cassandra, Kafka).
# Apply with: kubectl apply -f headless-service.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: default
  labels:
    app: web
spec:
  clusterIP: None   # This makes the service headless
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# Example StatefulSet that relies on the headless service for stable DNS names.
# Each pod gets: web-stateful-0.web-headless.default.svc.cluster.local, etc.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  namespace: default
spec:
  serviceName: web-headless   # Must match the headless Service name above
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
