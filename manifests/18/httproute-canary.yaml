# httproute-canary.yaml
# HTTPRoute implementing a canary deployment: 90% traffic to stable, 10% to canary.
# Uses Gateway API weight-based traffic splitting. Both backend services must exist.
# This enables progressive delivery without an external service mesh.
# Apply with: kubectl apply -f httproute-canary.yaml
---
# Stable (production) Service
apiVersion: v1
kind: Service
metadata:
  name: web-stable
  namespace: default
  labels:
    app: web
    track: stable
spec:
  selector:
    app: web
    track: stable
  ports:
    - port: 80
      targetPort: 8080
---
# Canary Service
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  namespace: default
  labels:
    app: web
    track: canary
spec:
  selector:
    app: web
    track: canary
  ports:
    - port: 80
      targetPort: 8080
---
# HTTPRoute with 90/10 weighted traffic split
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-canary-route
  namespace: default
spec:
  parentRefs:
    - name: prod-gateway   # Must match the Gateway name in gateway-class.yaml
      sectionName: https
  hostnames:
    - app.example.com
  rules:
    # Canary header override: send 100% to canary if header is present
    - matches:
        - headers:
            - name: x-canary
              value: "true"
      backendRefs:
        - name: web-canary
          port: 80
          weight: 100

    # Default weighted split: 90% stable, 10% canary
    - backendRefs:
        - name: web-stable
          port: 80
          weight: 90
        - name: web-canary
          port: 80
          weight: 10
