# Static IP macvlan NAD for RDMA/GPU workloads
# master: eth1 — the RDMA NIC, NOT the K8s overlay NIC (eth0)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-static
  namespace: gpu-workloads
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
