# ndots-pod.yaml
# Pod spec demonstrating dnsConfig customization.
# Setting ndots:1 means only names with 0 dots trigger a search-list lookup.
# The default ndots:5 causes up to 5 extra DNS round-trips for every external
# FQDN lookup (e.g., api.example.com gets tried as api.example.com.default.svc.cluster.local
# first). Setting ndots:1 dramatically reduces DNS query volume for external services.
# Combine with a trailing dot in FQDNs (api.example.com.) to skip search list entirely.
# Apply with: kubectl apply -f ndots-pod.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: ndots-demo
  namespace: default
  labels:
    app: ndots-demo
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  dnsPolicy: ClusterFirst
  dnsConfig:
    options:
      # Reduce search-list attempts: a name with >=1 dot is tried as-is first
      - name: ndots
        value: "1"
      # Time to wait for a DNS response before retrying (seconds)
      - name: timeout
        value: "5"
      # Number of retries before giving up
      - name: attempts
        value: "3"
      # Try the next nameserver when one is unavailable (requires ndots adjustment)
      - name: single-request-reopen
