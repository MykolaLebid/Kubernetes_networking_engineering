# Multus NetworkAttachmentDefinition — macvlan for RDMA/high-perf secondary NIC
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-net
  namespace: gpu-workloads
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "192.168.100.0/24",
        "rangeStart": "192.168.100.10",
        "rangeEnd": "192.168.100.200"
      }
    }
---
# GPU training pod with dual NICs: eth0 (K8s CNI) + net1 (RDMA/RoCE via Multus)
apiVersion: v1
kind: Pod
metadata:
  name: gpu-training-job
  namespace: gpu-workloads
  annotations:
    k8s.v1.cni.cncf.io/networks: rdma-net
spec:
  containers:
  - name: trainer
    image: nvcr.io/nvidia/pytorch:24.01-py3
    resources:
      limits:
        nvidia.com/gpu: "8"
    env:
    - name: NCCL_IB_HCA
      value: "mlx5_0"
    - name: NCCL_IB_GID_INDEX
      value: "3"
    - name: NCCL_DEBUG
      value: "INFO"
  nodeSelector:
    nvidia.com/gpu.present: "true"
