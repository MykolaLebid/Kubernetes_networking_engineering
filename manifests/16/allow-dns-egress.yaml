# allow-dns-egress.yaml
# Allows all pods in the namespace to reach kube-dns (CoreDNS) on UDP/TCP port 53.
# This policy MUST be applied alongside any default-deny-egress policy, otherwise
# pods will be unable to resolve DNS and all service discovery will fail.
# Apply with: kubectl apply -f allow-dns-egress.yaml -n <namespace>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: default
spec:
  podSelector: {}   # Applies to all pods in the namespace
  policyTypes:
    - Egress
  egress:
    # Allow DNS to kube-dns in kube-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
