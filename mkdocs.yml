site_name: Kubernetes Network Engineering
site_description: 34-lesson course on Kubernetes and Linux networking — from bare metal to AI GPU platforms
site_url: https://mykolalibid.github.io/Kubernetes_networking_engineering/
repo_url: https://github.com/MykolaLebid/Kubernetes_networking_engineering
repo_name: MykolaLebid/Kubernetes_networking_engineering
docs_dir: docs
site_dir: site
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MykolaLebid/Kubernetes_networking_engineering

nav:
  - Home: index.md
  - Course Map: course-map.md
  - Version Matrix: version-matrix.md
  - Resources: RESOURCES.md
  - "Track A — Linux Foundations":
    - "01 · Linux Networking Fundamentals": lessons/01-linux-networking-fundamentals.md
    - "02 · IP Routing and Forwarding": lessons/02-ip-routing-and-forwarding.md
    - "03 · iptables and Netfilter": lessons/03-iptables-and-netfilter.md
    - "04 · Network Namespaces Deep Dive": lessons/04-network-namespaces-deep-dive.md
    - "05 · VXLAN and Overlay Networks": lessons/05-vxlan-and-overlay-networks.md
    - "06 · BGP Fundamentals": lessons/06-bgp-fundamentals.md
    - "07 · Bare Metal Network Infrastructure": lessons/07-bare-metal-network-infrastructure.md
  - "Track B — CNI Plugins and eBPF":
    - "08 · Cloud Provider Networking": lessons/08-cloud-provider-networking.md
    - "09 · CNI Specification": lessons/09-cni-specification.md
    - "10 · eBPF and XDP": lessons/10-ebpf-xdp.md
    - "11 · Calico CNI Deep Dive": lessons/11-calico-cni-deep-dive.md
    - "12 · Cilium CNI and eBPF Dataplane": lessons/12-cilium-cni-ebpf.md
  - "Track C — Kubernetes Networking":
    - "13 · Kubernetes Services and kube-proxy": lessons/13-kubernetes-services-kube-proxy.md
    - "14 · CoreDNS and Service Discovery": lessons/14-coredns-service-discovery.md
    - "15 · IPv6 and Dual-Stack": lessons/15-ipv6-dual-stack.md
    - "16 · Network Policies": lessons/16-network-policies.md
  - "Track D — Ingress and Load Balancing":
    - "17 · Ingress Controllers": lessons/17-ingress-controllers.md
    - "18 · Gateway API": lessons/18-gateway-api.md
    - "19 · MetalLB and kube-vip": lessons/19-metallb-kube-vip.md
    - "20 · Cloud Provider Load Balancers": lessons/20-cloud-load-balancers.md
  - "Track E — Advanced Topics":
    - "21 · Service Mesh with Istio": lessons/21-service-mesh-istio.md
    - "22 · Multi-Cluster Networking": lessons/22-multi-cluster-networking.md
    - "23 · Network Security Hardening": lessons/23-network-security-hardening.md
    - "24 · Network Observability and Troubleshooting": lessons/24-network-observability-troubleshooting.md
  - "Track F — OpenShift Networking":
    - "25 · OpenShift Networking Overview": lessons/25-openshift-networking-overview.md
    - "26 · OVN-Kubernetes": lessons/26-ovn-kubernetes.md
    - "27 · OpenShift Routes and HAProxy": lessons/27-openshift-routes-haproxy.md
    - "28 · OpenShift EgressIP and EgressFirewall": lessons/28-openshift-egress.md
  - "Track G — AWS Networking":
